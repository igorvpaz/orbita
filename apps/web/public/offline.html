<!doctype html>
<html lang="pt-BR">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><meta name="theme-color" content="#20211f" /><title>
    Órbita · Sem conexão
  </title>
  <script src="/theme.js"></script>
  <style>
    body {
      margin: 0;
      background: #fcfcfa;
      color: #34362e;
      font: 16px Arial;
      min-height: 100svh;
      display: grid;
      place-items: center;
    }
    main {
      max-width: 400px;
      padding: 32px;
      text-align: center;
    }
    img {
      width: 90px;
    }
    h1 {
      font: 36px Georgia;
    }
    p {
      color: #888b7b;
      line-height: 1.8;
    }
    a {
      display: inline-block;
      background: #edc347;
      padding: 14px 24px;
      border-radius: 10px;
      color: #333;
      text-decoration: none;
      margin-top: 16px;
    }
    html[data-theme='dark'] body {
      background: #191b18;
      color: #eeeede;
    }
    html[data-theme='dark'] p {
      color: #b7bea9;
    }
  </style>
  <main>
    <img src="/icons/icon-192.png" alt="Órbita" />
    <h1>Estamos fora de órbita.</h1>
    <p>
      Você está sem conexão. Reconecte para acessar sua conta, consultar os
      serviços e enviar solicitações.
    </p>
    <a href="/member">Tentar novamente</a>
  </main>
  <script src="/offline-language.js"></script>
</html>
